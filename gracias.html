<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias! | KyoLab Avatars</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos específicos para centrar el contenido */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .thanks-card {
      background: rgba(30, 41, 59, 0.7); /* Vidrio oscuro */
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 90%;
      text-align: center;
      animation: slideUp 0.6s ease-out;
    }

    .thanks-card h1 {
      color: #ff3e3e; /* El rojo neón de tu marca */
      font-size: 2rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 15px rgba(255, 62, 62, 0.4);
    }

    .thanks-card p {
      line-height: 1.6;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .btn-back {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #ff3e3e, #c62828);
      color: white;
      padding: 12px 30px;
      border-radius: 50px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 62, 62, 0.6);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <div class="thanks-card">
    <div style="font-size: 4rem; margin-bottom: 1rem;">✉️</div>
    <h1>¡Pedido Recibido!</h1>
    <p>Tu solicitud de comisión ha sido enviada correctamente. Revisaré los detalles y te responderé vía email lo antes posible.</p>
    <a href="index.html" class="btn-back">Volver al Inicio</a>
  </div>
